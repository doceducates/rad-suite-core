# Rad Suite Core Production Docker Compose (<60 lines)
services:
  workstation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rad-suite-workstation
    restart: unless-stopped
    ports:
      - "4125:4125"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=4125
      - ENABLE_ACCEL_REDIRECT=true
      - NEXT_PUBLIC_APP_URL=https://radiology.sehatai.org
      - HMIS_GATEWAY_URL=http://host.docker.internal:8080
      - CLINIC_GATEWAY_URL=http://host.docker.internal:4130
    volumes:
      # Persistent Clinical SQLite Database & Backups
      - ./radsuite.db:/app/radsuite.db
      - ./radsuite.db-wal:/app/radsuite.db-wal
      - ./radsuite.db-shm:/app/radsuite.db-shm
      - ./db_backups:/app/db_backups
      # Anatomy Atlas Container & Private Disk Cache
      - ./radatlas:/app/radatlas
      # Modular Enterprise Plugins
      - ./plugins:/app/plugins
      # Environment configuration (read-only)
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4125/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
