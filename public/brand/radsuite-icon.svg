<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="rad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="rad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="rad-teal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="rad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="rad-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#rad-bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="5" y="5" width="118" height="118" rx="29" fill="url(#rad-glow)"/>

  <!-- Concentric Helical Gantry Rings (CT/MRI Scanner Motif) -->
  <circle cx="64" cy="64" r="48" stroke="url(#rad-cyan)" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.35"/>
  <circle cx="64" cy="64" r="40" stroke="url(#rad-teal)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="24 12 6 12"/>
  <circle cx="64" cy="64" r="32" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Scanning Laser / Reticle Crosshairs -->
  <line x1="64" y1="18" x2="64" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="64" y1="100" x2="64" y2="110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="18" y1="64" x2="28" y2="64" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="100" y1="64" x2="110" y2="64" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Stylized Geometric "R" (Aperture & Medical Beam) -->
  <g filter="url(#rad-shadow)">
    <!-- Vertical Pillar -->
    <path d="M44 38 C44 36.34 45.34 35 47 35 H52 C53.66 35 55 36.34 55 38 V90 C55 91.66 53.66 93 52 93 H47 C45.34 93 44 91.66 44 90 Z" fill="url(#rad-cyan)"/>

    <!-- Upper Loop with Helical Curve -->
    <path d="M52 35 H72 C81.94 35 90 42.16 90 51 C90 59.84 81.94 67 72 67 H54 V56 H71 C75.97 56 80 53.76 80 51 C80 48.24 75.97 46 71 46 H52 Z" fill="url(#rad-cyan)"/>

    <!-- Dynamic Diagonal Scan Leg -->
    <path d="M68 64 L86.5 89.5 C87.6 91.0 86.8 93 84.8 93 H74.2 C73.1 93 72.1 92.4 71.4 91.5 L56 67 H69 Z" fill="url(#rad-teal)"/>

    <!-- Luminous Central Focal Spot (Diagnostic Core) -->
    <circle cx="70" cy="51" r="4.5" fill="#ffffff"/>
    <circle cx="70" cy="51" r="7" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>
</svg>
