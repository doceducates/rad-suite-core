name: Build & Deploy Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.1)'
        required: true
        default: '1.0.1'
      release_notes:
        description: 'Release Notes summary'
        required: false
        default: 'Performance optimizations, DICOM streaming improvements, and bug fixes.'
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Native Windows Installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Next.js Standalone
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://radiology.sehatai.org
          BUILD_TARGET: desktop
        run: npm run build

      - name: Compile Tauri NSIS Installer
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          if (-not $ver) { $ver = "1.0.0" }
          $notes = "${{ github.event.inputs.release_notes }}"
          if (-not $notes) {
            $recentCommits = git log -n 8 --pretty=format:"- %s" --no-merges
            if ($recentCommits) {
              $notes = "Rad Suite Diagnostic Radiology Workstation v$ver`n$recentCommits"
            } else {
              $notes = "Rad Suite Diagnostic Radiology Workstation release $ver`n- Performance optimizations, DICOM streaming improvements, and bug fixes."
            }
          }
          
          powershell -ExecutionPolicy Bypass -File scripts/release-desktop.ps1 -Version $ver -ReleaseNotes $notes -SkipNextBuild

      - name: Upload Release Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: rad-suite-windows-installer
          path: |
            public/releases/*.exe
            public/releases/latest.json
          retention-days: 14

      - name: Publish to GitHub Releases (Free Global CDN Hosting)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: Rad Suite Workstation ${{ github.event.inputs.version || github.ref_name }}
          body: ${{ github.event.inputs.release_notes || 'Official Rad Suite Radiology Workstation standalone release for Windows 10/11 x64.' }}
          draft: false
          prerelease: false
          files: |
            public/releases/*.exe
            public/releases/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Installer & Updater Manifest to VPS
        if: env.VPS_SSH_KEY != ''
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DIR: ${{ secrets.VPS_DIR }}
        run: |
          # Write SSH private key to temporary file
          $sshDir = "$env:USERPROFILE\.ssh"
          if (-not (Test-Path $sshDir)) { New-Item -ItemType Directory -Path $sshDir -Force | Out-Null }
          $keyFile = "$sshDir\vps_deploy_key"
          [System.IO.File]::WriteAllText($keyFile, $env:VPS_SSH_KEY)
          
          # Upload latest.json and .exe via SCP directly to the VPS
          $target = "${env:VPS_USER}@${env:VPS_HOST}:${env:VPS_DIR}/"
          scp -P $env:VPS_PORT -o StrictHostKeyChecking=no -i $keyFile public/releases/latest.json $target
          scp -P $env:VPS_PORT -o StrictHostKeyChecking=no -i $keyFile public/releases/*.exe $target
          
          # Prune older .exe files on VPS to retain ONLY the latest build
          $latestName = (Get-ChildItem public/releases/*.exe | Select-Object -First 1).Name
          if ($latestName) {
            ssh -p $env:VPS_PORT -o StrictHostKeyChecking=no -i $keyFile "${env:VPS_USER}@${env:VPS_HOST}" "cd ${env:VPS_DIR} && ls -1 *.exe 2>/dev/null | grep -v '$latestName' | xargs -r rm -f && chown -R www:www ${env:VPS_DIR} && chmod 644 ${env:VPS_DIR}/*"
          }
          
          # Clean up private key
          Remove-Item -Force $keyFile
